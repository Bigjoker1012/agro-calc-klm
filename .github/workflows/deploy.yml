name: Deploy to klm-fid.by

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Expo web app
        env:
          EXPO_PUBLIC_DOMAIN: calc.klm-fid.by
        run: |
          cd artifacts/agro-calc
          pnpm exec expo export --platform web --output-dir dist

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Expo web app
        run: |
          rsync -az --delete \
            artifacts/agro-calc/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/web/

      - name: Deploy API server
        run: |
          rsync -az \
            artifacts/api-server/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/artifacts/api-server/dist/

      - name: Restart API server on VPS
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'ENDSSH'
            pm2 restart agro-calc-api
            pm2 save
          ENDSSH
