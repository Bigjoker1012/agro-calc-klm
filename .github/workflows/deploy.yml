name: Deploy to klm-fid.by

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Expo web app
        run: pnpm --filter @workspace/agro-calc run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Expo web app
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.expo' \
            artifacts/agro-calc/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/agro-calc/dist/
          rsync -az \
            artifacts/agro-calc/server/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/agro-calc/server/
          rsync -az \
            artifacts/agro-calc/app.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/agro-calc/app.json

      - name: Deploy API server
        run: |
          rsync -az \
            artifacts/api-server/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/api-server/dist/

      - name: Restart services on VPS
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            export GOOGLE_SERVICE_ACCOUNT_JSON='${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}'
            cd ${{ secrets.DEPLOY_PATH }}
            pm2 restart agro-calc 2>/dev/null || \
              PORT=3000 pm2 start agro-calc/server/serve.js --name agro-calc
            PORT=8080 GOOGLE_SERVICE_ACCOUNT_JSON="$GOOGLE_SERVICE_ACCOUNT_JSON" \
              pm2 restart api-server 2>/dev/null || \
              PORT=8080 GOOGLE_SERVICE_ACCOUNT_JSON="$GOOGLE_SERVICE_ACCOUNT_JSON" \
              pm2 start api-server/dist/index.mjs --name api-server
            pm2 save
          ENDSSH
